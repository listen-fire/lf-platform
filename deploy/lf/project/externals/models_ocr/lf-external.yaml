# The ocr slot on Gemini (the models module's OCR install, in
# /srv/lf/modules/models), installed in the image. Not the default: name it in
# lf.yaml (core: { ocr: models_ocr }) and give it the models install's settings
# again as LF_SECRET__MODELS_OCR__VENDOR=gemini, __API_KEY, … (see lf.yaml).
# Also needs LF_SECRET__MODELS_OCR__EXTERNAL=models_ocr.
name: models_ocr
kind: core
slot: ocr
command: [node, --require, /srv/lf/packages/module-kit/node_modules/tsx/dist/cjs/index.cjs, /srv/lf/modules/models/serve_ocr.ts]
settings:
  - { name: vendor, label: "gemini (the vendor whose models read PDFs and images)" }
  - { name: api_key, label: "a Gemini API key (leave empty to use Google Cloud instead)", secret: true, optional: true }
  - { name: model, label: "the Gemini model that reads the files (default gemini-3.8-flash)", optional: true }
  - { name: model_map, label: "per name overrides, as the platform's MODEL_MAP; a file goes where `sonnet` goes", optional: true }
  - { name: google_project, label: "Google Cloud: the project (gemini without an API key)", optional: true }
  - { name: google_region, label: "Google Cloud: where models are addressed (default global)", optional: true }
  - { name: google_client_email, label: "Google Cloud: a service account's email (empty to use the environment's own Google credentials)", optional: true }
  - { name: google_private_key, label: "Google Cloud: that service account's private key", secret: true, optional: true }
  - { name: base_url, label: "another endpoint speaking Gemini's API (a proxy); empty for Google's", optional: true }
