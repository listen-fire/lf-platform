# The cloud files slot (the S3-interface bucket module in /srv/lf/modules/s3-files),
# installed in the image. Not the default: name it in lf.yaml (core: { files: s3_files })
# and give it its settings as LF_SECRET__S3_FILES__BUCKET, __REGION, … (see lf.yaml).
# Either also needs LF_SECRET__<NAME>__EXTERNAL set to the install's name.
name: s3_files
kind: core
slot: files
# A core module is started by `command` (`module:` is for adapters), from this
# folder, so the paths are absolute.
command: [node, --require, /srv/lf/packages/module-kit/node_modules/tsx/dist/cjs/index.cjs, /srv/lf/modules/s3-files/serve.ts]
settings:
  - { name: bucket, label: the bucket documents are kept in }
  - { name: region, label: "the bucket's region (auto for R2; us-east-1 for MinIO and GCS)" }
  - { name: endpoint, label: "the S3 endpoint of a service that is not AWS (https://storage.googleapis.com, https://<account>.r2.cloudflarestorage.com, http://minio:9000)", optional: true }
  - { name: key_prefix, label: a folder inside the bucket to keep documents under, optional: true }
  - { name: path_style, label: "true to put the bucket in the path (MinIO, a bare IP); empty for AWS, GCS and R2", optional: true }
  - { name: access_key_id, label: "the access key id (empty on AWS with an IAM role)", secret: true, optional: true }
  - { name: secret_access_key, label: the secret access key, secret: true, optional: true }
