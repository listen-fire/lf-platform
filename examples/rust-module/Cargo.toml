[package]
name = "rust-module-example"
version = "0.0.0"
edition.workspace = true
publish = false
license.workspace = true
description = "Two crate modules (a notes adapter and a plugin package) served by one module host over adapter protocol 2"

[dependencies]
module-kit = { package = "listen-fire-module-kit", path = "../../crates/module-kit" }

[[bin]]
name = "notes-module-host"
path = "src/main.rs"
