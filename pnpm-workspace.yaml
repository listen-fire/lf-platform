packages:
  - "apps/*"
  - "packages/*"
  - "modules/*"

# The language core (engine, engine-contracts, movement-lang) moves on one
# version: adopting a core release is this block. Every other @listen-fire
# package is pinned on its own version in the package that uses it.
catalog:
  "@listen-fire/engine": 0.12.8
  "@listen-fire/engine-contracts": 0.12.8
  "@listen-fire/movement-lang": 0.12.8
  movement-engine: npm:@listen-fire/engine@0.12.8
  engine-contracts: npm:@listen-fire/engine-contracts@0.12.8
  movement-lang: npm:@listen-fire/movement-lang@0.12.8
